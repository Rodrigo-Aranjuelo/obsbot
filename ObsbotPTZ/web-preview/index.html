<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBSBOT PTZ - Browser Preview</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#0b1220; color:#e5e7eb; margin:0; }
    .wrap { max-width: 420px; margin: 24px auto; padding: 16px; }
    .card { background:#111827; border:1px solid #1f2937; border-radius:16px; padding:16px; margin-bottom:14px; }
    h1 { font-size:20px; margin:0 0 10px; }
    .muted { color:#9ca3af; font-size:13px; }
    .status { font-weight:600; margin-top:8px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    button { border:0; border-radius:12px; padding:10px 12px; font-weight:600; cursor:pointer; }
    .primary { background:#2563eb; color:white; }
    .secondary { background:#374151; color:white; }
    .danger { background:#b91c1c; color:white; }
    .ptz { display:grid; grid-template-columns:56px 56px 56px; gap:10px; justify-content:center; margin-top:10px; }
    .ptz button { height:44px; }
    .log { background:#030712; border:1px solid #1f2937; border-radius:8px; padding:8px; min-height:88px; font-size:12px; overflow:auto; }
    code { color:#93c5fd; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>OBSBOT PTZ (Preview Web)</h1>
      <div class="muted">Vista de UI para validar layout/flujo en browser (no controla cámara real).</div>
      <div class="status" id="status">Estado: Desconectado</div>
    </div>

    <div class="card">
      <div><strong>Cámara</strong></div>
      <div class="muted">IP: <code>192.168.1.9</code> · VISCA UDP: <code>52381</code></div>
      <div class="muted">RTSP: <code>rtsp://192.168.1.9/stream1</code></div>
      <div class="row" style="margin-top:10px;">
        <button class="primary" onclick="mockConnect()">Connect</button>
        <button class="danger" onclick="mockDisconnect()">Disconnect</button>
      </div>
    </div>

    <div class="card">
      <div><strong>PTZ</strong></div>
      <div class="ptz">
        <span></span><button class="secondary" onclick="send('PTZ ↑')">↑</button><span></span>
        <button class="secondary" onclick="send('PTZ ←')">←</button>
        <button class="danger" onclick="send('PTZ STOP')">Stop</button>
        <button class="secondary" onclick="send('PTZ →')">→</button>
        <span></span><button class="secondary" onclick="send('PTZ ↓')">↓</button><span></span>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="secondary" onclick="send('ZOOM +')">Zoom +</button>
        <button class="secondary" onclick="send('ZOOM -')">Zoom -</button>
        <button class="danger" onclick="send('ZOOM STOP')">Zoom Stop</button>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="secondary" onclick="send('PRESET 1')">Preset 1</button>
        <button class="secondary" onclick="send('PRESET 2')">Preset 2</button>
        <button class="secondary" onclick="send('PRESET 3')">Preset 3</button>
      </div>
    </div>

    <div class="card">
      <div><strong>Log</strong></div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    let connected = false;

    function now() {
      return new Date().toLocaleTimeString();
    }

    function append(msg) {
      logEl.innerHTML = `[${now()}] ${msg}<br>` + logEl.innerHTML;
    }

    function mockConnect() {
      connected = true;
      statusEl.textContent = 'Estado: Conectado (simulado)';
      append('Connect pressed (simulación browser).');
    }

    function mockDisconnect() {
      connected = false;
      statusEl.textContent = 'Estado: Desconectado';
      append('Disconnect pressed.');
    }

    function send(cmd) {
      if (!connected) {
        append(`❌ ${cmd} ignorado: primero Connect.`);
        return;
      }
      append(`✅ ${cmd} enviado (simulado).`);
    }
  </script>
</body>
</html>
